index.html
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Ledger">
<title>The Ledger — Life RPG</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap');

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#14111f;
  color:#edeaf6;
}

body{
  font-family:'Work Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}

button{font:inherit}

#app{
  max-width:650px;
  margin:auto;
  padding:
    calc(22px + env(safe-area-inset-top))
    16px
    calc(40px + env(safe-area-inset-bottom));
}

.card{
  border:1px solid #322c48;
  border-radius:10px;
  padding:18px;
  margin-bottom:18px;
  background:#171421;
}

.title,.section{
  font-family:Cinzel,serif;
}

.title{
  font-size:22px;
  font-weight:700;
}

.gold{color:#c9a24b}
.muted{color:#9c96b5}

.header{
  position:relative;
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.bar{
  height:8px;
  background:#241f38;
  border-radius:5px;
  overflow:hidden;
  margin-top:14px;
}

.fill{
  height:100%;
  background:#c9a24b;
  transition:.3s;
}

.small{font-size:12px}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  border:1px solid #322c48;
  border-radius:8px;
  padding:12px;
}

.statname{
  font-size:13px;
  font-weight:600;
}

.rank{
  font-size:11px;
  margin-top:6px;
}

.statbar{
  height:5px;
  border-radius:4px;
  background:#29243c;
  margin-top:7px;
  overflow:hidden;
}

.quest{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 10px;
  border-top:1px solid #241f38;
  cursor:pointer;
}

.quest:first-child{
  border-top:0;
}

.check{
  width:21px;
  height:21px;
  border:1.5px solid #4a4468;
  border-radius:5px;
  display:grid;
  place-items:center;
  flex:none;
}

.done .qname{
  text-decoration:line-through;
  color:#8e88a7;
}

.qname{
  flex:1;
  font-size:14px;
}

.tag{
  font-size:11px;
}

.streak{
  font-size:12px;
  color:#c9a24b;
}

.week{
  display:flex;
  gap:7px;
  align-items:flex-end;
  height:115px;
}

.day{
  flex:1;
  text-align:center;
  font-size:10px;
  color:#655f80;
}

.daynum{
  font-size:11px;
  color:#9c96b5;
  margin-bottom:5px;
}

.barcol{
  height:65px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.barcol i{
  display:block;
  width:70%;
  max-width:34px;
  background:#4a4468;
  border-radius:4px 4px 2px 2px;
  min-height:4px;
}

.barcol i.today{
  background:#c9a24b;
}

.reset{
  background:none;
  border:0;
  color:#655f80;
  text-decoration:underline;
  cursor:pointer;
}

.avatar{
  text-align:center;
  margin-top:28px;
}

.aura{
  width:130px;
  height:130px;
  margin:12px auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:radial-gradient(
    circle,
    #6e74c9 0%,
    transparent 68%
  );
  animation:pulse 2.5s infinite;
}

.person{
  font-size:70px;
}

.banner{
  position:fixed;
  left:14px;
  right:14px;
  top:calc(15px + env(safe-area-inset-top));
  z-index:5;
  background:#2b2140;
  border:1px solid #c9a24b;
  border-radius:12px;
  padding:15px;
  text-align:center;
  color:#c9a24b;
  font-family:Cinzel,serif;
  box-shadow:0 12px 35px #0008;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
    opacity:.82;
  }
}

@media(max-width:420px){
  .stats{
    grid-template-columns:1fr;
  }

  .tag{
    display:none;
  }

  .qname{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const KEY='life-rpg-data-v2';

const STATS={
  strength:['Strength','#c1554a'],
  vitality:['Vitality','#4f9c6c'],
  wisdom:['Wisdom','#6e74c9'],
  intellect:['Intellect','#3fa3a3'],
  discipline:['Discipline','#d08a3e'],
  charisma:['Charisma','#c15690']
};

const TASKS=[
  ['workout','💪','Workout','strength'],
  ['protein','🥪','Eat a protein sandwich','strength'],
  ['water','💧','Drink 3 bottles of water','vitality'],
  ['meals','🍽️','Eat only 5 times today','vitality'],
  ['read','📖','Read a chapter','wisdom'],
  ['video','🎬','Watch a useful video','wisdom'],
  ['study','🎓','Homework / study','intellect'],
  ['french','🇫🇷','Study French','intellect'],
  ['walk','🚶','Morning walk','discipline'],
  ['bed','🛏️','Make your bed','discipline'],
  ['gift','🎁','Do something nice for your girlfriend','charisma'],
  ['pictures','📸','Send her 3 pictures','charisma']
];

const RANKS=[
  'Base Form',
  'Super Saiyan',
  'Super Saiyan 2',
  'Super Saiyan 3',
  'Super Saiyan God',
  'Super Saiyan Blue',
  'Ultra Instinct -Sign-',
  'Mastered Ultra Instinct'
];

const TH=[
  0,
  35,
  85,
  150,
  230,
  325,
  435,
  560
];

const GAIN=10;
const DECAY=3;

const pad=n=>String(n).padStart(2,'0');

function dateStr(d=new Date()){
  return d.getFullYear()+'-'+
    pad(d.getMonth()+1)+'-'+
    pad(d.getDate());
}

function add(s,n){
  let d=new Date(s+'T12:00:00');
  d.setDate(d.getDate()+n);
  return dateStr(d);
}

function today(){
  return dateStr();
}

function yesterday(){
  return add(today(),-1);
}

function rank(x){
  let r=0;

  TH.forEach((v,i)=>{
    if(x>=v) r=i;
  });

  return r;
}

function xpLevel(n){
  return 100+(n-1)*10;
}

function fresh(){

  let p={};

  Object.keys(STATS).forEach(k=>{
    p[k]=0;
  });

  return{
    history:{},
    power:p,
    lastProcessed:yesterday()
  };
}

function load(){

  try{

    return JSON.parse(
      localStorage.getItem(KEY)
    ) || fresh();

  }catch(e){

    return fresh();

  }

}

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}

function settle(d){

  let p={...d.power};

  let c=add(
    d.lastProcessed,
    1
  );

  let stop=today();

  while(c<stop){

    TASKS.forEach(t=>{

      let done=
        (d.history[t[0]]||[])
        .includes(c);

      p[t[3]]=
        Math.max(
          0,
          (p[t[3]]||0)+
          (done?GAIN:-DECAY)
        );

    });

    c=add(c,1);

  }

  return{
    ...d,
    power:p,
    lastProcessed:add(stop,-1)
  };

}

let data=settle(load());

save();

function power(k){

  let live=
    TASKS.filter(
      t=>
        t[3]===k &&
        (data.history[t[0]]||[])
        .includes(today())
    ).length*GAIN;

  return(data.power[k]||0)+live;

}

function streak(a){

  let s=new Set(a||[]);

  let c=
    s.has(today())
      ?today()
      :s.has(yesterday())
        ?yesterday()
        :null;

  let n=0;

  while(c && s.has(c)){

    n++;

    c=add(c,-1);

  }

  return n;

}

function levelInfo(){

  let total=
    Object.keys(STATS)
      .reduce(
        (a,k)=>a+power(k),
        0
      );

  let lv=1;
  let x=total;

  while(
    x>=xpLevel(lv)
  ){

    x-=xpLevel(lv);
    lv++;

  }

  return[
    lv,
    x,
    xpLevel(lv)
  ];

}

function toggle(id){

  let a=data.history[id]||[];
  let t=today();

  let on=a.includes(t);

  data.history[id]=
    on
      ?a.filter(x=>x!==t)
      :[...a,t];

  save();

  render();

}

function reset(){

  if(
    confirm(
      'Erase all Ledger progress?'
    )
  ){

    data=fresh();

    save();

    render();

  }

}

let lastLevel=
  levelInfo()[0];

function showBanner(lv){

  let b=
    document.createElement('div');

  b.className='banner';

  b.textContent=
    '✨ Level up! You reached level '+lv;

  document.body.appendChild(b);

  setTimeout(
    ()=>b.remove(),
    3200
  );

}

function render(){

  let[
    lv,
    x,
    need
  ]=levelInfo();

  if(lv>lastLevel){

    showBanner(lv);

  }

  lastLevel=lv;

  let done=
    TASKS.filter(
      t=>
        (data.history[t[0]]||[])
        .includes(today())
    ).length;

  let pct=
    Math.min(
      100,
      Math.round(
        x/need*100
      )
    );

  let html=`

    <div class="card header">

      <div class="top">

        <div class="title">
          The Ledger
        </div>

        <div
          class="gold"
          style="font-family:Cinzel,serif"
        >
          Level ${lv}
        </div>

      </div>

      <div class="bar">

        <div
          class="fill"
          style="width:${pct}%"
        ></div>

      </div>

      <div
        class="small muted"
        style="margin-top:7px"
      >
        ${x} / ${need} XP to level ${lv+1}
        · ${done}/${TASKS.length}
        quests done today
      </div>

    </div>

  `;

  html+=`

    <div
      class="section"
      style="margin:0 0 10px"
    >
      Stats
    </div>

    <div class="stats">

  `;

  for(let k in STATS){

    let p=power(k);

    let r=rank(p);

    let floor=TH[r];

    let ceil=
      TH[r+1]||floor+1;

    let pc=
      r===7
        ?100
        :Math.round(
          (p-floor)/
          (ceil-floor)*
          100
        );

    html+=`

      <div class="stat">

        <div class="statname">
          ${STATS[k][0]}
        </div>

        <div
          class="rank"
          style="color:${STATS[k][1]}"
        >
          ${RANKS[r]} · ${p} XP
        </div>

        <div class="statbar">

          <div
            style="
              width:${pc}%;
              height:100%;
              background:${STATS[k][1]}
            "
          ></div>

        </div>

      </div>

    `;

  }

  html+=`</div>`;

  html+=`

    <div
      class="section"
      style="margin:22px 0 10px"
    >
      Today's quests
    </div>

    <div
      class="card"
      style="padding:0;overflow:hidden"
    >

  `;

  TASKS.forEach(t=>{

    let d=
      (data.history[t[0]]||[])
      .includes(today());

    let s=
      streak(
        data.history[t[0]]||[]
      );

    html+=`

      <div
        class="quest ${d?'done':''}"
        onclick="toggle('${t[0]}')"
      >

        <div
          class="check"
          style="${
            d
              ?'background:'+STATS[t[3]][1]+
               ';border-color:'+STATS[t[3]][1]
              :''
          }"
        >
          ${d?'✓':''}
        </div>

        <div style="font-size:18px">
          ${t[1]}
        </div>

        <div class="qname">
          ${t[2]}
        </div>

        <div
          class="tag"
          style="color:${STATS[t[3]][1]}"
        >
          ${STATS[t[3]][0]}
        </div>

        ${
          s
            ?`<div class="streak">
                🔥${s}
              </div>`
            :''
        }

      </div>

    `;

  });

  html+=`</div>`;

  let days=[];

  for(let i=6;i>=0;i--){

    days.push(
      add(today(),-i)
    );

  }

  let counts=
    days.map(
      d=>
        TASKS.filter(
          t=>
            (data.history[t[0]]||[])
            .includes(d)
        ).length
    );

  let max=
    Math.max(1,...counts);

  html+=`

    <div
      class="section"
      style="margin:22px 0 10px"
    >
      This week
    </div>

    <div class="card">

      <div class="week">

  `;

  days.forEach((d,i)=>{

    let lab=
      d===today()
        ?'Today'
        :new Date(
          d+'T12:00:00'
        ).toLocaleDateString(
          'en-US',
          {weekday:'short'}
        );

    html+=`

      <div class="day">

        <div class="daynum">
          ${counts[i]}
        </div>

        <div class="barcol">

          <i
            class="${d===today()?'today':''}"
            style="
              height:${Math.max(
                5,
                counts[i]/max*65
              )}px
            "
          ></i>

        </div>

        <div>
          ${lab}
        </div>

      </div>

    `;

  });

  html+=`

      </div>

      <div
        class="small muted"
        style="margin-top:15px"
      >
        Keep the streak alive.
        Missed quests lose ${DECAY} XP
        when a day is settled.
      </div>

    </div>

  `;

  let totalRanks=
    Object.keys(STATS)
      .reduce(
        (a,k)=>a+rank(power(k)),
        0
      );

  let avg=
    Math.round(
      totalRanks/6
    );

  html+=`

    <div class="avatar">

      <div class="section">
        Your current form
      </div>

      <div class="aura">

        <div class="person">
          ${
            [
              '🧍',
              '⚡',
              '⚡',
              '🔥',
              '🔴',
              '🔵',
              '⚪',
              '✨'
            ][avg]
          }
        </div>

      </div>

      <div
        class="gold"
        style="font-family:Cinzel,serif"
      >
        ${RANKS[avg]}
      </div>

    </div>

    <div
      style="
        text-align:center;
        margin-top:25px
      "
    >

      <button
        class="reset"
        onclick="reset()"
      >
        ↻ Reset progress
      </button>

    </div>

  `;

  document.getElementById(
    'app'
  ).innerHTML=html;

}

render();

</script>

</body>
</html>
